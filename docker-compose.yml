# mesvotes en production.
# - L'application écoute sur 127.0.0.1:${APP_PORT} (accessible seulement depuis le serveur).
# - Caddy (HTTPS automatique) ne démarre que si .env contient COMPOSE_PROFILES=caddy.
#   Sans lui, c'est ton serveur web existant (Nginx, Apache…) qui sert mesvotes : voir docs/reverse-proxy.md
# Les valeurs viennent du fichier .env (voir .env.example).

services:
  app:
    build: .
    image: mesvotes:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "true"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Renseigne DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:-contact@mesvotes.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
